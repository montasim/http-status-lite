name: Publish http-status-lite

on:
    push:
        tags: ["http-status-lite-v*"]

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        if: github.repository == 'montasim/http-status-lite'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v4
              with:
                  version: 11.7.0
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
                  registry-url: https://registry.npmjs.org
            - run: pnpm install --frozen-lockfile
            - run: pnpm check:package
            - name: Verify tag matches package version
              run: node -e "if ('http-status-lite-v' + require('./packages/http-status-lite/package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
            - run: pnpm --dir packages/http-status-lite publish --provenance --access public --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
