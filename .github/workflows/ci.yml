name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    verify:
        name: Workspace and package verification
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v4
              with:
                  version: 11.7.0
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - name: Build release tarball
              run: |
                  mkdir artifact
                  pnpm --dir packages/http-status-lite pack --ignore-scripts --pack-destination ../../artifact
            - uses: actions/upload-artifact@v7
              with:
                  name: npm-package
                  path: artifact/*.tgz
                  if-no-files-found: error

    runtime:
        name: Packed runtime on Node.js ${{ matrix.node-version }}
        needs: verify
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [18.x, 20.x, 22.x, 24.x]
        steps:
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
            - uses: actions/download-artifact@v8
              with:
                  name: npm-package
                  path: artifact
            - name: Install packed package
              run: |
                  mkdir consumer
                  cd consumer
                  npm init --yes
                  npm install --ignore-scripts --no-audit --no-fund ../artifact/http-status-lite-*.tgz
            - name: Test ESM
              working-directory: consumer
              run: node --input-type=module --eval "import { Status, getStatus } from 'http-status-lite'; if (Status.OK !== 200 || getStatus(404).name !== 'NOT_FOUND') process.exit(1)"
            - name: Test CommonJS
              working-directory: consumer
              run: node --input-type=commonjs --eval "const { Status } = require('http-status-lite'); if (Status.OK !== 200) process.exit(1)"
