name: CI

on:
    push:
        branches: [main, v2]
    pull_request:
        branches: [main, v2]

permissions:
    contents: read

jobs:
    verify:
        name: Node.js ${{ matrix.node-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [18.x, 20.x, 22.x]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format
            - run: npm test

    package:
        name: Published package smoke test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: npm
            - run: npm ci
            - run: npm run test:all
