name: IANA registry drift

on:
    schedule:
        - cron: "17 6 1 * *"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v4
              with:
                  version: 11.7.0
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm registry:update
            - name: Fail when generated registry data changed
              run: git diff --exit-code -- packages/http-status-lite/registry packages/http-status-lite/src/generated packages/http-status-lite/src/codes.ts
