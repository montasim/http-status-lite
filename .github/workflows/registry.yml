name: IANA registry drift

on:
    schedule:
        - cron: '17 6 1 * *'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: npm
            - run: npm ci
            - run: npm run registry:update
            - name: Fail when generated registry data changed
              run: git diff --exit-code -- registry src/generated src/codes.ts
