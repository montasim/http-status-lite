[build]
  command = "pnpm build:web"
  publish = "apps/web/dist/client"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "11.7.0"

[dev]
  command = "pnpm dev:web"
  targetPort = 3000
  port = 8888

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
